[project]
name = "harbour-control"
version = "1.0.0"
description = "Gullrock Ferries control plane: detector, findings, MCP tools, approval pages and the remediation runner"
requires-python = "==3.15.*"
dependencies = [
    "fastmcp==4.1.8",
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "clickhouse-connect==1.12.0",
    "pydantic==2.14.3",
    "opentelemetry-distro==0.66b2",
    "opentelemetry-exporter-otlp==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-urllib3==0.66b2",
]

[dependency-groups]
dev = ["pytest==9.2.0"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbour_control"]
